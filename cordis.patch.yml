# dsh-mind 自带的装载层。
#
# **一张插件卡，三个组件。** 插件列表里出现的是本包（一张卡）；
# 卡片下面「包含的组件」是这三行，每行一个独立开关。
#
# 单包自洽（2026-10-11 可发布化批）：三行的 `name` 是**本包的子路径导出**
# （`dsh-mind/kernel` 等），由本包 package.json 的 `exports` 解析——
# 用户只需装 `dsh-mind` 一个包，三行全部可达。
# 为什么不再是三个独立包：旧四包形态靠 profile 里手写四行 `link:` 依赖才能装齐
# （`link:` 是纯符号链接协议，pnpm **不解析**目标包自己的 dependencies——
# 官方 `dsh plugin add` 只写一行主包依赖，组件就「静默不装」，实测在案）；
# 子路径导出则走标准模块解析（含 Node 自引用），装一个包即闭合。
#
# 关掉一行 = 那个组件不进 roster = 它的工具 / 命令 / 浏览器半区一起消失：
#   关 dsh-mind-guard → 没有探针与升级运维，判定与记账照常
#   关 dsh-mind-board → 没有面板与侧边栏入口，组织照常跑
# 内核那一行没有开关：关掉它，这张卡就只剩一个空壳。

- insert:
    - id: dsh-mind-kernel
      name: dsh-mind/kernel

    - id: dsh-mind-guard
      name: dsh-mind/guard
      config:
        开机自检: true

    - id: dsh-mind-board
      name: dsh-mind/board
